name: Fix index introduction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix introduction and remove temporary workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- OFFICIAL HISTORICAL NARRATIVE AND VISION SECTION -->'
          start = s.index(marker)
          div_start = s.index('<div style="text-align: left;', start)
          div_end = s.index('</div>', div_start) + len('</div>')
          replacement = '''<div style="text-align: left; margin: 20px 0; line-height: 1.6; color: #444444; font-size: 1rem;">\n    <p style="font-weight: bold; color: #7a2014; font-size: 1.15rem; border-left: 4px solid #FF9933; padding-left: 10px; margin-bottom: 15px; font-style: italic;">\n        "Brief About Sant Baba Moni Saheb Vriddh Anand Ashram"\n    </p>\n    \n    <p style="margin-bottom: 12px;">\n        Established in <strong>2005</strong>, our old age home was founded with the pure, unwavering intention of providing shelter, compassionate care, and spiritual support to senior citizens.\n    </p>\n    \n    <p style="margin-bottom: 12px;">\n        Since our humble beginnings in 2005, the Trust has overcome many challenges, made steady progress, and expanded its services in response to the growing needs of senior citizens.\n    </p>\n    \n    <p style="margin-bottom: 15px;">\n        Observing that the number of needy senior citizens in our community is increasing day by day, the Trust has taken steps toward its next major service initiative: expanding the Ashram and constructing new facilities.\n    </p>\n</div>'''
          s = s[:div_start] + replacement + s[div_end:]
          p.write_text(s, encoding='utf-8')
      - name: Commit repaired page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-index-introduction.yml
          git commit -m "Fix English introduction text" || exit 0
          git push
