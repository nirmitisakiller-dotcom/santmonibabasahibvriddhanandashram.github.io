name: Fix English Introduction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace English introduction from Hindi/Marathi equivalent
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = '<!-- OFFICIAL HISTORICAL NARRATIVE AND VISION SECTION -->'
          start = text.index(marker)
          div_start = text.index('<div style="text-align: left;', start)
          div_end = text.index('</div>', div_start) + len('</div>')

          replacement = '''<div style="text-align: left; margin: 20px 0; line-height: 1.6; color: #444444; font-size: 1rem;">
              <p style="font-weight: bold; color: #7a2014; font-size: 1.15rem; border-left: 4px solid #FF9933; padding-left: 10px; margin-bottom: 15px; font-style: italic;">
                  "Brief About Sant Baba Moni Saheb Vriddh Anand Ashram"
              </p>

              <p style="margin-bottom: 12px;">
                  Established in <strong>2005</strong>, our old age home was founded with the pure, unwavering intention of providing shelter, compassionate care, and spiritual support to senior citizens.
              </p>

              <p style="margin-bottom: 12px;">
                  Since our humble beginnings in 2005, the Trust has overcome many challenges, made steady progress, and expanded its services in response to the growing needs of senior citizens.
              </p>

              <p style="margin-bottom: 15px;">
                  Observing that the number of needy senior citizens in our community is increasing day by day, the Trust has taken steps toward its next major service initiative: expanding the Ashram and constructing new facilities.
              </p>
          </div>'''

          text = text[:div_start] + replacement + text[div_end:]
          path.write_text(text, encoding='utf-8')

          verify = path.read_text(encoding='utf-8')
          for item in [
              'Established in <strong>2005</strong>',
              'Since our humble beginnings in 2005',
              'the number of needy senior citizens in our community is increasing day by day',
              'expanding the Ashram and constructing new facilities.',
          ]:
              assert item in verify, f'Missing expected text: {item}'
          assert '[T}' not in verify
          assert '[T...]' not in verify
          print('English introduction verified.')

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -f .github/workflows/fix-index-introduction.yml
          git commit -m 'fix: repair English introduction text'
          git push
