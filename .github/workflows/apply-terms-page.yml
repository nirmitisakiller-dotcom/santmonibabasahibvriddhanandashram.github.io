name: Apply Terms Page Update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update footer links and sitemap
        run: |
          python3 <<'PY'
          from pathlib import Path

          link = '<a href="terms.html">Terms &amp; Conditions</a>'
          for name in ('index.html', 'marathi.html', 'hindi.html'):
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if link not in s:
                  marker = '<div class="footer-bottom">'
                  if marker not in s:
                      raise SystemExit(f'Footer marker not found in {name}')
                  s = s.replace(marker, marker + '\n            ' + link, 1)
                  p.write_text(s, encoding='utf-8')

          p = Path('sitemap.xml')
          s = p.read_text(encoding='utf-8')
          url = 'https://santmonibabasahibvriddhanandashram.org/terms.html'
          if url not in s:
              needle = '  <url>\n    <loc>https://santmonibabasahibvriddhanandashram.org/disclaimer.html</loc>\n  </url>'
              block = f'  <url>\n    <loc>{url}</loc>\n  </url>'
              if needle in s:
                  s = s.replace(needle, needle + '\n' + block, 1)
              else:
                  s = s.replace('</urlset>', block + '\n</urlset>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/apply-terms-page.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html marathi.html hindi.html sitemap.xml .github/workflows/apply-terms-page.yml
          git diff --cached --quiet || git commit -m 'feat: add terms and conditions links'
          git push origin HEAD:main
