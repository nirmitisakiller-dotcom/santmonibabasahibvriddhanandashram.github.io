name: Final site cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply verified cleanup
        shell: python
        run: |
          from pathlib import Path

          files = [Path('index.html'), Path('hindi.html'), Path('marathi.html')]
          maps = 'https://www.google.com/maps/search/?api=1&query=Sant+Baba+Moni+Sahib+Vriddhanand+Ashram%2C+Survey+No.133%2F1%2C+Gurudwara+Road%2C+Near+Akurdi+Station%2C+Walhekarwadi%2C+Pune+411033'

          replacements = {
              'href="https://google.com"': f'href="{maps}"',
              'Donation details will be displayed here.': 'For donation information, please contact the Ashram using the details on our Contact Us page.',
              'दान का बैंक विवरण यहाँ प्रदर्शित किया जाएगा।': 'दान संबंधी जानकारी के लिए कृपया Contact Us पेज पर दिए गए आश्रम के संपर्क विवरण का उपयोग करें।',
              'देणगीची माहिती येथे प्रदर्शित केली जाईल.': 'देणगीसंबंधी माहितीसाठी कृपया Contact Us पृष्ठावर दिलेल्या आश्रमाच्या संपर्क तपशीलांचा वापर करा.',
              "onerror=\"this.style.display='none'; this.parentNode.innerText='[Khanda Photo]';\"": '',
              "onerror=\"this.style.display='none'; this.parentNode.innerText='Baba Photo';\"": '',
          }

          expected = {
              'href="https://google.com"': 3,
              'Donation details will be displayed here.': 1,
              'दान का बैंक विवरण यहाँ प्रदर्शित किया जाएगा।': 1,
          }

          for path in files:
              text = path.read_text(encoding='utf-8')
              for old, minimum in expected.items():
                  count = text.count(old)
                  if old == 'href="https://google.com"' and count not in (0, 1):
                      raise SystemExit(f'Unexpected map-link count in {path}: {count}')
                  if old != 'href="https://google.com"' and count > 1:
                      raise SystemExit(f'Unexpected duplicate placeholder in {path}: {count}')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

      - name: Verify cleanup
        run: |
          ! grep -RFn 'https://google.com"' index.html hindi.html marathi.html
          ! grep -RFn 'Donation details will be displayed here.' index.html hindi.html marathi.html
          ! grep -RFn 'दान का बैंक विवरण यहाँ प्रदर्शित किया जाएगा।' index.html hindi.html marathi.html
          ! grep -RFn 'देणगीची माहिती येथे प्रदर्शित केली जाईल.' index.html hindi.html marathi.html
          ! grep -RFn '[Khanda Photo]' index.html hindi.html marathi.html
          ! grep -RFn 'Baba Photo' index.html hindi.html marathi.html

      - name: Commit HTML cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html hindi.html marathi.html
          git diff --cached --quiet && exit 0
          git commit -m 'chore: remove final placeholders and fix map links'
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/final-site-cleanup.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary cleanup workflow' || true
          git push || true
