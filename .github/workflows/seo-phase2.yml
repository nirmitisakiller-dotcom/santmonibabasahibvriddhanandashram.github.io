name: Phase 2 SEO metadata

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'hindi.html'
      - 'marathi.html'
      - 'modal-system.js'
      - 'repair-marathi-modals.py'
      - '.github/workflows/seo-phase2.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required site files
        run: |
          python3 <<'PY'
          from pathlib import Path

          required = ('index.html', 'hindi.html', 'marathi.html', 'modal-system.js')
          for filename in required:
              path = Path(filename)
              if not path.is_file():
                  raise SystemExit(f'Missing required file: {filename}')

          for filename in ('index.html', 'hindi.html', 'marathi.html'):
              text = Path(filename).read_text(encoding='utf-8')
              if '<script src="modal-system.js"></script>' not in text:
                  raise SystemExit(f'Shared modal system is not loaded by {filename}')

          print('Site files and shared modal system references validated successfully.')
          PY

      - name: Restore OG Register Loved Ones and Volunteer modals
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          def extract_div(text, marker):
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'Could not find {marker}')
              pos = start
              depth = 0
              while True:
                  open_pos = text.find('<div', pos)
                  close_pos = text.find('</div>', pos)
                  if close_pos < 0:
                      raise SystemExit(f'Unbalanced div structure after {marker}')
                  if open_pos >= 0 and open_pos < close_pos:
                      depth += 1
                      pos = open_pos + 4
                  else:
                      depth -= 1
                      pos = close_pos + len('</div>')
                      if depth == 0:
                          return start, pos, text[start:pos]

          current_path = Path('index.html')
          current = current_path.read_text(encoding='utf-8')
          old = subprocess.check_output(
              ['git', 'show', 'fed5dd3fd745a0aef6c1ab16db7ba4313756fd69:index.html'],
              text=True,
          )

          updated = current

          _, _, old_register = extract_div(old, '<div id="registerModal"')
          cur_start, cur_end, _ = extract_div(updated, '<div id="registerModal"')
          updated = updated[:cur_start] + old_register + updated[cur_end:]

          _, _, old_volunteer_div = extract_div(old, '<div id="volunteerModal"')
          volunteer_marker = '<!-- SECOND POP-UP MODAL: VOLUNTEER SIGN-UP FORM -->'
          first_volunteer_marker = updated.find(volunteer_marker)
          first_volunteer_id = updated.find('<div id="volunteerModal"')

          if first_volunteer_marker >= 0:
              insertion_point = first_volunteer_marker
          elif first_volunteer_id >= 0:
              insertion_point = first_volunteer_id
          else:
              insertion_point = -1

          if insertion_point >= 0:
              while True:
                  pos = updated.find('<div id="volunteerModal"')
                  if pos < 0:
                      break
                  _, end, _ = extract_div(updated, '<div id="volunteerModal"')
                  marker_pos = updated.rfind(volunteer_marker, 0, pos + 1)
                  if marker_pos >= 0 and pos - marker_pos < 200:
                      pos = marker_pos
                  updated = updated[:pos] + updated[end:]
                  if pos < insertion_point:
                      insertion_point -= (end - pos)

              anchor = updated.find('    <script>\n        function toggleAttachmentFields')
              if anchor < 0:
                  anchor = updated.find('</body>')
              if anchor < 0:
                  raise SystemExit('Could not find a safe insertion point for Volunteer modal')
              updated = updated[:anchor] + volunteer_marker + '\n' + old_volunteer_div + '\n\n' + updated[anchor:]
          else:
              anchor = updated.find('    <script>\n        function toggleAttachmentFields')
              if anchor < 0:
                  anchor = updated.find('</body>')
              if anchor < 0:
                  raise SystemExit('Could not find a safe insertion point for Volunteer modal')
              updated = updated[:anchor] + volunteer_marker + '\n' + old_volunteer_div + '\n\n' + updated[anchor:]

          if updated.count('<div id="volunteerModal"') != 1:
              raise SystemExit('Volunteer modal repair did not leave exactly one volunteerModal element')

          old_handler = 'onclick="document.getElementById(\'registerModal\').style.display=\'flex\'"'
          new_handler = ('onclick="var m=document.getElementById(\'registerModal\');'
                         'if(m){m.style.setProperty(\'display\',\'flex\',\'important\');'
                         'm.style.setProperty(\'visibility\',\'visible\',\'important\');'
                         'm.style.setProperty(\'opacity\',\'1\',\'important\');} return false;"')
          if old_handler in updated:
              updated = updated.replace(old_handler, new_handler, 1)

          if updated != current:
              current_path.write_text(updated, encoding='utf-8')
              print('Exact OG Register Loved Ones and exactly one OG Volunteer modal restored from the historical working commit.')
          else:
              print('OG Register Loved Ones and exactly one OG Volunteer modal already match the historical implementation.')
          PY

          if git diff --quiet -- index.html; then
            echo 'No modal restoration changes needed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'fix: remove duplicate volunteer modal'
            git push
          fi

      - name: Restore Marathi OG modals
        run: python3 repair-marathi-modals.py

      - name: Verify Marathi modal counts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('marathi.html').read_text(encoding='utf-8')
          assert text.count('<div id="volunteerModal"') == 1
          assert text.count('<div id="registerModal"') == 1
          assert 'स्वयंसेवक व्हा' in text
          assert 'आपल्या प्रिय व्यक्तीची नोंदणी करा' in text
          print('Marathi modal verification passed.')
          PY

      - name: Commit Marathi repair
        run: |
          if git diff --quiet -- marathi.html; then
            echo 'Marathi modals already repaired.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add marathi.html
            git commit -m 'fix: restore Marathi OG volunteer and register popups'
            git push
          fi
