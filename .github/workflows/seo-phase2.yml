name: Phase 2 SEO metadata

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'hindi.html'
      - 'marathi.html'
      - 'modal-system.js'
      - '.github/workflows/seo-phase2.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required site files
        run: |
          python3 <<'PY'
          from pathlib import Path

          required = ('index.html', 'hindi.html', 'marathi.html', 'modal-system.js')
          for filename in required:
              path = Path(filename)
              if not path.is_file():
                  raise SystemExit(f'Missing required file: {filename}')

          for filename in ('index.html', 'hindi.html', 'marathi.html'):
              text = Path(filename).read_text(encoding='utf-8')
              if '<script src="modal-system.js"></script>' not in text:
                  raise SystemExit(f'Shared modal system is not loaded by {filename}')

          print('Site files and shared modal system references validated successfully.')
          PY

      - name: Restore OG Register Loved Ones and Volunteer modals
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          def extract_div(text, marker):
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'Could not find {marker}')
              pos = start
              depth = 0
              while True:
                  open_pos = text.find('<div', pos)
                  close_pos = text.find('</div>', pos)
                  if close_pos < 0:
                      raise SystemExit(f'Unbalanced div structure after {marker}')
                  if open_pos >= 0 and open_pos < close_pos:
                      depth += 1
                      pos = open_pos + 4
                  else:
                      depth -= 1
                      pos = close_pos + len('</div>')
                      if depth == 0:
                          return start, pos, text[start:pos]

          current_path = Path('index.html')
          current = current_path.read_text(encoding='utf-8')
          old = subprocess.check_output(
              ['git', 'show', 'fed5dd3fd745a0aef6c1ab16db7ba4313756fd69:index.html'],
              text=True,
          )

          updated = current

          # Restore the historical Register Loved Ones modal by its stable element id.
          _, _, old_register = extract_div(old, '<div id="registerModal"')
          cur_start, cur_end, _ = extract_div(updated, '<div id="registerModal"')
          updated = updated[:cur_start] + old_register + updated[cur_end:]

          # Restore the historical Volunteer modal by its stable comment boundary.
          volunteer_start = old.find('<!-- SECOND POP-UP MODAL: VOLUNTEER SIGN-UP FORM -->')
          volunteer_end = old.find('<!-- INLINE JAVASCRIPT LOGIC BLOCK FOR TOGGLING ATTACHMENTS -->')
          if volunteer_start < 0 or volunteer_end < 0 or volunteer_end <= volunteer_start:
              raise SystemExit('Could not find historical Volunteer modal boundaries')
          old_volunteer = old[volunteer_start:volunteer_end]

          current_start = updated.find('<!-- SECOND POP-UP MODAL: VOLUNTEER SIGN-UP FORM -->')
          current_end = updated.find('<!-- INLINE JAVASCRIPT LOGIC BLOCK FOR TOGGLING ATTACHMENTS -->')
          if current_start >= 0 and current_end > current_start:
              updated = updated[:current_start] + old_volunteer + updated[current_end:]
          else:
              anchor = updated.find('    <script>\n        function toggleAttachmentFields')
              if anchor < 0:
                  anchor = updated.find('</body>')
              if anchor < 0:
                  raise SystemExit('Could not find a safe insertion point for Volunteer modal')
              updated = updated[:anchor] + old_volunteer + '\n' + updated[anchor:]

          old_handler = 'onclick="document.getElementById(\'registerModal\').style.display=\'flex\'"'
          new_handler = ('onclick="var m=document.getElementById(\'registerModal\');'
                         'if(m){m.style.setProperty(\'display\',\'flex\',\'important\');'
                         'm.style.setProperty(\'visibility\',\'visible\',\'important\');'
                         'm.style.setProperty(\'opacity\',\'1\',\'important\');} return false;"')
          if old_handler in updated:
              updated = updated.replace(old_handler, new_handler, 1)

          if updated != current:
              current_path.write_text(updated, encoding='utf-8')
              print('Exact OG Register Loved Ones and Volunteer modals restored from the historical working commit.')
          else:
              print('OG Register Loved Ones and Volunteer modals already match the historical implementation.')
          PY

          if git diff --quiet -- index.html; then
            echo 'No modal restoration changes needed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'fix: restore OG Volunteer Registration Form'
            git push
          fi
